name: ?? 1-Click Quantum AI Auto-Deploy CI/CD

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: ?? Checkout Repository
        uses: actions/checkout@v4

      - name: ?? Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ?? Install Dependencies
        run: npm ci || npm install

      - name: ?? Verify Python QPO Engine
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: ?? Execute Testnet Verification
        run: |
          node scripts/deploy_all_testnets.cjs

      - name: ??? Compile Web 4.0 Platform (Vite)
        run: npm run build

      - name: ?? Deploy to Netlify (1-Click Auto Deploy)
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: './dist'
          production-branch: master
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy from GitHub Actions: ${{ github.sha }}"
          enable-pull-request-comment: false
          enable-commit-comment: true
          overwrites-pull-request-comment: true
        continue-on-error: true